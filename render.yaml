services:
  - type: web
    name: vydo
    runtime: docker
    healthCheckPath: /api/health
    disk:
      name: vydo-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PUBLIC_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
