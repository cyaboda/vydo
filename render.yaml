services:
  - type: web
    name: vydo
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: "off"
    domains:
      - vydo.download
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://vydo.download
      - key: COOKIE_SECURE
        value: "true"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: TMPDIR
        value: /tmp
      - key: REQUIRE_POSTGRES
        value: "true"
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      - key: APP_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_AUTH_ENABLED
        value: "false"
      - key: AUTH_PUBLIC_SIGNUP_ENABLED
        value: "false"
