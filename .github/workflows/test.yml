name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: vydo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
        env:
          FFMPEG_BIN: /usr/bin/ffmpeg
          TEST_DATABASE_URL: postgresql://postgres:ci-test-password@localhost:5432/vydo_test
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ui-check.mjs
      - run: node scripts/ads-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: test-results/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vydo:test .
      - run: |
          docker run -d --name vydo --init -p 3000:3000 -e PUBLIC_ORIGIN=http://localhost:3000 vydo:test
          for i in $(seq 1 25); do curl --fail http://localhost:3000/api/health && exit 0; sleep 2; done
          docker logs vydo
          exit 1
